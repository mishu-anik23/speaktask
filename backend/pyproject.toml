[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speaktask"
version = "0.1.0"
description = "Voice-command AI web app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-jose>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.6",
    "cryptography>=41.0",
    "redis>=5.0",
    "celery>=5.3",
    "httpx>=0.25",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "httpx>=0.25",
]

[tool.setuptools]
packages = ["app"]
